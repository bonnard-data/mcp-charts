name: Publish to npm

# Publishes the version currently in packages/core/package.json.
# Bump the version locally (npm version ... + push) BEFORE running this — see README "Releasing".
# CI is intentionally read-only here (the org disables workflow write); it never commits or tags.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Builds the widget, then core (embeds the fresh widget) — the publishable artifact.
      - name: Build
        run: pnpm build

      # Validate package shape + type resolution before anything is published.
      - name: Validate package
        run: pnpm check:exports

      - name: Publish with provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
