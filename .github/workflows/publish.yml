name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump + tag
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bump version
        working-directory: packages/core
        env:
          BUMP: ${{ inputs.version }}
        run: npm version "$BUMP" --no-git-tag-version

      # Builds the widget, then core (embeds the fresh widget) — the publishable artifact.
      - name: Build
        run: pnpm build

      # Validate package shape + type resolution before anything is published.
      - name: Validate package
        run: pnpm check:exports

      - name: Publish with provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Commit version bump
        run: |
          NEW_VERSION=$(node -p "require('./packages/core/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json
          git commit -m "Release @bonnard/mcp-charts v${NEW_VERSION}"
          git tag "mcp-charts-v${NEW_VERSION}"
          git push origin main --tags
