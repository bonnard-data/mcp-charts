name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump + push tags
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Auto-publish on push (the org disallows Actions-created PRs, so no "Version Packages" PR).
      - name: Detect pending changesets
        id: cs
        run: |
          if [ -n "$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # Aggregate the changesets into one bump + changelog, publish to npm, then push the version
      # commit and tags. The follow-up push has no changesets, so the re-triggered run is a no-op.
      - name: Version, publish, tag
        if: steps.cs.outputs.pending == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          git add -A
          git commit -m "chore: version packages"
          pnpm release
          git push --follow-tags origin main

      # Mirror the new version's changelog section onto the pushed tag as a GitHub Release. Runs
      # after the publish, so a failure here leaves npm and the tags intact.
      - name: Publish the GitHub Release
        if: steps.cs.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag="@bonnard/mcp-charts@$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # The topmost "## <version>" section of the changelog, minus its heading.
          awk '/^## /{n++} n==1' packages/core/CHANGELOG.md | tail -n +2 > /tmp/notes.md
          printf '\n---\n\n[`%s` on npm](https://www.npmjs.com/package/@bonnard/mcp-charts/v/%s)\n' "$tag" "$version" >> /tmp/notes.md
          gh release create "$tag" --verify-tag --title "v$version" --notes-file /tmp/notes.md --latest
