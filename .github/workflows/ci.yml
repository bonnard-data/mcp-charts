name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      # Builds the widget first, then core (embeds the widget) — fails loudly if the widget is missing.
      - run: pnpm build

      - run: pnpm test

      # Validate the publishable package: exports map + type resolution across module systems.
      - run: pnpm check:exports
