name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Build first: widget -> core (embeds the widget). typecheck/lint of the widget + examples
      # resolve `@bonnard/mcp-charts` types from core's built dist, so dist must exist before them.
      - run: pnpm build

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Validate the publishable package: exports map + type resolution across module systems.
      - run: pnpm check:exports
