<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonnard Chart</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --grid: #e5e7eb;
        --border: #e5e7eb;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      html[data-theme="dark"] {
        --bg: #171717;
        --fg: #fafafa;
        --muted: #9ca3af;
        --grid: #2a2a2a;
        --border: #2a2a2a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        padding: 12px;
      }
      #root {
        width: 100%;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      /* ECharts needs an explicit pixel height; it manages its own SVG sizing inside. */
      .ec {
        width: 100%;
        height: 340px;
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tbl th,
      .tbl td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
      }
      .tbl th {
        color: var(--muted);
        font-weight: 600;
      }
      .tbl td:not(:first-child),
      .tbl th:not(:first-child) {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .empty,
      .fallback {
        color: var(--muted);
        font-size: 13px;
        padding: 16px 4px;
      }
      .fallback {
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Dashboard: a CSS grid of chart / KPI / text cells. */
      .dash-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
        gap: 12px;
      }
      .cell {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
      /* Dashboard cells are shorter than the 340px single-chart height. */
      .cell .ec {
        height: 240px;
      }
      .cell[data-span="2"] {
        grid-column: span 2;
      }
      .cell[data-span="3"] {
        grid-column: span 3;
      }
      .cell[data-span="4"] {
        grid-column: span 4;
      }
      /* Responsive 1-col fallback (iframe viewport width): collapse and neutralize spans. */
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .cell {
          grid-column: auto !important;
        }
      }
      .kpi .kpi-label {
        font-size: 12px;
        color: var(--muted);
      }
      .kpi .kpi-value {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .kpi .kpi-delta {
        font-size: 14px;
        font-weight: 600;
        margin-left: 8px;
      }
      .kpi .kpi-delta.up {
        color: #16a34a;
      }
      .kpi .kpi-delta.down {
        color: #dc2626;
      }
      .kpi .kpi-caption {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .text-block {
        font-size: 13px;
        line-height: 1.5;
      }
      .text-block h3 {
        font-size: 13px;
        margin: 0 0 4px;
      }
      .unsupported {
        color: var(--muted);
        font-size: 13px;
      }
      .dash-notes {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
      }
      .cell-notes {
        color: var(--muted);
        font-size: 11px;
        margin-top: 8px;
      }
      /* Embed mode (`#embed`): the consumer owns spacing, chrome, and height. Everything below is
         inert without the `data-embed` root attribute set by embed.ts. */
      html[data-embed] body {
        padding: 0;
      }
      /* Fill-container height chain, so a chart takes the consumer's box instead of a fixed 340px.
         `#root` fills only when it holds a chart: an intrinsic-height cell (KPI, text, table) must
         stay content-height so its `scrollHeight` measures content, not the viewport. */
      html[data-embed],
      html[data-embed] body {
        height: 100%;
      }
      html[data-embed] #root:has(> .ec),
      html[data-embed] #root:has(> .solo.chart) {
        height: 100%;
      }
      /* A single cell (`.solo`) carries no border, radius, or padding: the consumer's container is
         the only frame. A chart cell fills the height chain; the rest stay intrinsic. */
      html[data-embed] .solo {
        min-width: 0;
      }
      html[data-embed] .solo.chart {
        height: 100%;
      }
      /* A chart with a title or note gives those their intrinsic height and takes the rest. */
      html[data-embed] .solo.chart,
      html[data-embed] #root:has(> .ec) {
        display: flex;
        flex-direction: column;
      }
      html[data-embed] .solo.chart .cell-chart {
        flex: 1;
        min-height: 0;
      }
      /* Min-height guard: a consumer who forgets to size the frame still sees a chart. Scoped to the
         single-cell shapes so a whole-dashboard embed keeps the grid's own 240px cells. */
      html[data-embed] .solo.chart .cell-chart,
      html[data-embed] .solo .ec,
      html[data-embed] #root > .ec {
        height: 100%;
        min-height: 240px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
