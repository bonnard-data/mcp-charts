<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defence in depth: the widget is one self-contained file that renders inline SVG. It needs no
         network at all, so every fetching directive is denied outright. `unsafe-inline` covers the
         inlined bundle and the style block; `data:` covers ECharts' inline SVG data URIs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Bonnard Chart</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --grid: #e5e7eb;
        --border: #e5e7eb;
        --font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-family: var(--font-family);
      }
      html[data-theme="dark"] {
        --bg: #171717;
        --fg: #fafafa;
        --muted: #9ca3af;
        --grid: #2a2a2a;
        --border: #2a2a2a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        /* background-color, not the `background` shorthand: a token value can then only ever be a
           colour, never an image/url() layer. */
        background-color: var(--bg);
        color: var(--fg);
        padding: 12px;
      }
      #root {
        width: 100%;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      /* ECharts needs an explicit pixel height; it manages its own SVG sizing inside. */
      .ec {
        width: 100%;
        height: 340px;
      }
      /* Bound a table's growth in both axes so tall tables scroll instead of growing the card
         unbounded, and wide tables scroll instead of clipping/overlapping at the cell edge. */
      .tbl-scroll {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 320px;
      }
      .tbl {
        width: 100%;
        /* `border-spacing: 0` not `border-collapse: collapse`: a sticky header over collapsed
           borders drops its bottom border while scrolling (cross-browser quirk), so the row rule
           lives on a cell box-shadow instead. */
        border-spacing: 0;
        font-size: 13px;
      }
      .tbl th,
      .tbl td {
        text-align: left;
        padding: 6px 10px;
        box-shadow: inset 0 -1px 0 var(--border);
      }
      .tbl thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--bg);
      }
      .tbl th {
        color: var(--muted);
        font-weight: 600;
      }
      .tbl td:not(:first-child),
      .tbl th:not(:first-child) {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .empty,
      .fallback {
        color: var(--muted);
        font-size: 13px;
        padding: 16px 4px;
      }
      .fallback {
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Dashboard: a CSS grid of chart / KPI / text cells. */
      .dash-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
        gap: 12px;
        /* Without this the default `stretch` pulls a short cell (a 3-row table, a KPI) to the height
           of its tallest grid-row neighbour, leaving empty space under its content. Chart cells keep
           their explicit `.cell .ec` height regardless. */
        align-items: start;
      }
      .cell {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
      /* Dashboard cells are shorter than the 340px single-chart height. */
      .cell .ec {
        height: 240px;
      }
      .cell[data-span="2"] {
        grid-column: span 2;
      }
      .cell[data-span="3"] {
        grid-column: span 3;
      }
      .cell[data-span="4"] {
        grid-column: span 4;
      }
      /* Responsive 1-col fallback (iframe viewport width): collapse and neutralize spans. */
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .cell {
          grid-column: auto !important;
        }
      }
      /* A KPI tile sizes its value against the cell, not the viewport, so the same tile fits a
         4-column grid and a full-width solo embed. */
      .cell.kpi,
      html[data-embed] .solo.kpi {
        container-type: inline-size;
      }
      .kpi .kpi-label {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .kpi .kpi-value {
        /* A full-digit currency amount ("GBP 1,648,745,000") is ~17 characters with one break
           opportunity, so at a fixed 26px it spilled past a narrow cell. Scale with the cell and
           break anywhere as a last resort: an oversized value shrinks, then wraps, never clips. */
        font-size: clamp(14px, 12cqi, 26px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .kpi .kpi-delta {
        /* Relative to the value, so the delta shrinks with it instead of crowding the same line. */
        font-size: 0.54em;
        font-weight: 600;
        margin-left: 8px;
      }
      .kpi .kpi-delta.up {
        color: #16a34a;
      }
      .kpi .kpi-delta.down {
        color: #dc2626;
      }
      .kpi .kpi-caption {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .text-block {
        font-size: 13px;
        line-height: 1.5;
      }
      .text-block .text-body {
        overflow-wrap: anywhere;
      }
      .text-block h3 {
        font-size: 13px;
        margin: 0 0 4px;
      }
      /* Markdown emitted into .text-body by markdown-it (html: false, so only these generated tags). */
      .text-block .text-body > :first-child {
        margin-top: 0;
      }
      .text-block .text-body > :last-child {
        margin-bottom: 0;
      }
      .text-block .text-body p {
        margin: 0 0 8px;
      }
      .text-block .text-body strong {
        font-weight: 600;
      }
      .text-block .text-body em {
        font-style: italic;
      }
      .text-block .text-body ul,
      .text-block .text-body ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .text-block .text-body li {
        margin: 2px 0;
      }
      .text-block .text-body a {
        color: inherit;
        text-decoration: underline;
      }
      .text-block .text-body h1,
      .text-block .text-body h2,
      .text-block .text-body h3,
      .text-block .text-body h4,
      .text-block .text-body h5,
      .text-block .text-body h6 {
        font-size: 13px;
        font-weight: 600;
        margin: 8px 0 4px;
      }
      .unsupported {
        color: var(--muted);
        font-size: 13px;
      }
      .dash-notes {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
        overflow-wrap: anywhere;
      }
      .cell-notes {
        color: var(--muted);
        font-size: 11px;
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      /* Embed mode (`#embed`): the consumer owns spacing, chrome, and height. Everything below is
         inert without the `data-embed` root attribute set by embed.ts. */
      html[data-embed] body {
        padding: 0;
      }
      /* Fill-container height chain, so a chart takes the consumer's box instead of a fixed 340px.
         Gated on `data-sizing="fill"`, which main.ts sets per payload. In content mode html/body
         stay `auto` (the iframe-resizer rule), so `scrollHeight` measures content and can never
         echo back the height the parent just wrote: no size feedback loop is possible. */
      html[data-embed][data-sizing="fill"],
      html[data-embed][data-sizing="fill"] body,
      html[data-embed][data-sizing="fill"] #root {
        height: 100%;
      }
      html[data-embed][data-sizing="content"],
      html[data-embed][data-sizing="content"] body,
      html[data-embed][data-sizing="content"] #root {
        height: auto;
      }
      /* A single cell (`.solo`) carries no border, radius, or padding: the consumer's container is
         the only frame. */
      html[data-embed] .solo {
        min-width: 0;
      }
      /* Everything below is fill mode only. A content-mode cell (KPI, text, table) must keep its
         intrinsic height, or its measurement would report the viewport rather than the content. */
      html[data-embed][data-sizing="fill"] .solo.chart {
        height: 100%;
      }
      /* A chart with a title or note gives those their intrinsic height and takes the rest. */
      html[data-embed][data-sizing="fill"] .solo.chart,
      html[data-embed][data-sizing="fill"] #root:has(> .ec) {
        display: flex;
        flex-direction: column;
      }
      /* Fill mode tracks the frame at every height. Any min-height floor here would make a frame
         shorter than the floor overflow rather than shrink, clipping the x-axis tick labels; an
         unsized iframe still has its 150px intrinsic height, so no floor is needed to stay visible. */
      html[data-embed][data-sizing="fill"] .solo.chart .cell-chart,
      html[data-embed][data-sizing="fill"] .solo .ec,
      html[data-embed][data-sizing="fill"] #root > .ec {
        height: 100%;
        min-height: 0;
      }
      html[data-embed][data-sizing="fill"] .solo.chart .cell-chart {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
